<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fleet management operations console." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Fleet Management</title>
    <script>
      try {
        var theme = localStorage.getItem('fleet.theme')
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = theme === 'dark' || ((!theme || theme === 'system') && systemDark)
        if (dark) document.documentElement.classList.add('dark')
      } catch (error) {
        /* Storage can be blocked. The app still applies the theme after startup. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
